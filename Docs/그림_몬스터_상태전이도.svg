<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 756" width="1060" height="756" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="1060" height="756" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4852"/>
    </marker>
  </defs>

  <!-- ===== 순찰 그룹 ===== -->
  <rect x="50" y="104" width="250" height="200" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.2" rx="5"/>
  <text x="64" y="126" font-size="12.5" font-weight="bold" fill="#52606d">순찰 — 탐지 활성</text>

  <rect x="74" y="140" width="202" height="54" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" rx="4"/>
  <text x="175" y="163" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">대기</text>
  <text x="175" y="182" font-size="11" text-anchor="middle" fill="#52606d">정지 · 탐지 코루틴 시작</text>

  <rect x="74" y="232" width="202" height="54" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" rx="4"/>
  <text x="175" y="255" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">이동</text>
  <text x="175" y="274" font-size="11" text-anchor="middle" fill="#52606d">한 방향 순찰 · 종료 시 반전</text>

  <line x1="126" y1="194" x2="126" y2="230" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="92" y="216" font-size="10.5" fill="#1f2933">3~5초</text>
  <line x1="224" y1="230" x2="224" y2="194" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="232" y="216" font-size="10.5" fill="#1f2933">2~4초</text>

  <!-- ===== 복귀 ===== -->
  <rect x="50" y="386" width="250" height="62" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" rx="4"/>
  <text x="175" y="410" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">복귀</text>
  <text x="175" y="429" font-size="11" text-anchor="middle" fill="#52606d">게이지 0으로 초기화 · 탐지 재개</text>

  <line x1="110" y1="384" x2="110" y2="306" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="124" y="350" font-size="10.5" fill="#1f2933">스폰 지점 도달</text>

  <!-- ===== 교전 ===== -->
  <rect x="430" y="120" width="210" height="64" fill="#e7ecf1" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="535" y="145" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">추적</text>
  <text x="535" y="164" font-size="11" text-anchor="middle" fill="#52606d">탐지 코루틴 정지</text>

  <rect x="430" y="256" width="210" height="64" fill="#e7ecf1" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="535" y="281" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">전투</text>
  <text x="535" y="300" font-size="11" text-anchor="middle" fill="#52606d">간격 유지 · 공격 대기 시간 경과</text>

  <rect x="430" y="392" width="210" height="64" fill="#e7ecf1" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="535" y="417" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">공격</text>
  <text x="535" y="436" font-size="11" text-anchor="middle" fill="#52606d">돌진 후 공격 모션 재생</text>

  <!-- 순찰 → 추적 -->
  <path d="M 300 170 L 428 152" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <text x="309" y="146" font-size="11" font-weight="bold" fill="#1f2933">탐지 게이지 100 도달</text>

  <!-- 추적 ⇄ 전투 -->
  <line x1="500" y1="184" x2="500" y2="254" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="493" y="216" font-size="10.5" text-anchor="end" fill="#1f2933">전투 범위 진입</text>
  <line x1="572" y1="254" x2="572" y2="184" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="582" y="216" font-size="10.5" fill="#1f2933">전투 범위 이탈</text>

  <!-- 전투 ⇄ 공격 -->
  <line x1="500" y1="320" x2="500" y2="390" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="493" y="345" font-size="10.5" text-anchor="end" fill="#1f2933">공격 준비 완료</text>
  <text x="493" y="360" font-size="10.5" text-anchor="end" fill="#1f2933">· 최소 간격 이내</text>
  <line x1="572" y1="390" x2="572" y2="320" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="582" y="352" font-size="10.5" fill="#1f2933">공격 모션 종료</text>

  <!-- 추적/전투 → 복귀 -->
  <path d="M 430 168 L 336 168 L 336 417 L 302 417" fill="none" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M 430 300 L 336 300" fill="none" stroke="#3d4852" stroke-width="1.4"/>
  <text x="318" y="462" font-size="11" font-weight="bold" fill="#1f2933">타깃 상실</text>
  <text x="318" y="478" font-size="10" fill="#7b8794">탐지 범위 이탈 2초 경과</text>

  <!-- ===== 외부 이벤트 진입 ===== -->
  <rect x="756" y="104" width="266" height="356" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.2" stroke-dasharray="5 4" rx="5"/>
  <text x="770" y="126" font-size="12.5" font-weight="bold" fill="#52606d">외부 이벤트 — 모든 상태에서 진입</text>

  <rect x="778" y="142" width="222" height="86" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" rx="4"/>
  <text x="889" y="166" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">피격</text>
  <text x="889" y="185" font-size="11" text-anchor="middle" fill="#52606d">게이지 즉시 100으로 설정</text>
  <text x="889" y="205" font-size="10.5" text-anchor="middle" fill="#7b8794">경과 후 → 전투 (타깃 있음)</text>
  <text x="889" y="220" font-size="10.5" text-anchor="middle" fill="#7b8794">→ 복귀 (타깃 없음)</text>

  <rect x="778" y="250" width="222" height="86" fill="#ffffff" stroke="#1f2933" stroke-width="1.6" rx="4"/>
  <text x="889" y="274" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">기절</text>
  <text x="889" y="293" font-size="11" text-anchor="middle" fill="#52606d">처형 대상 레이어로 전환</text>
  <text x="889" y="313" font-size="10.5" text-anchor="middle" fill="#7b8794">경과 후 → 전투 (타깃 있음)</text>
  <text x="889" y="328" font-size="10.5" text-anchor="middle" fill="#7b8794">→ 복귀 (타깃 없음)</text>

  <rect x="778" y="358" width="222" height="80" fill="#dfe6ec" stroke="#1f2933" stroke-width="2" rx="4"/>
  <text x="889" y="382" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">사망</text>
  <text x="889" y="401" font-size="11" text-anchor="middle" fill="#52606d">체력 0 이벤트 · 전리품 생성</text>
  <text x="889" y="421" font-size="10.5" text-anchor="middle" fill="#7b8794">사이클 리셋 시 대기로 복원</text>

  <!-- 범례 -->
  <text x="50" y="520" font-size="12" font-weight="bold" fill="#1f2933">탐지 게이지가 100에 도달하는 경로</text>
  <line x1="50" y1="532" x2="1000" y2="532" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="556" font-size="11.5" fill="#52606d">· 누적 : 소음 인지도와 조도 인지도의 합을 0.1초마다 가산. 두 인지도 모두 거리로 나누며, 차폐 시 소음은 0.2배, 조도는 0이 된다.</text>
  <text x="50" y="578" font-size="11.5" fill="#52606d">· 즉시 : 플레이어가 손전등을 켠 상태로 전투 범위 안에 들어오면 누적을 거치지 않고 게이지를 100으로 설정한다.</text>

  <text x="50" y="614" font-size="12" font-weight="bold" fill="#1f2933">전이 조건의 소재</text>
  <line x1="50" y1="626" x2="1000" y2="626" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="650" font-size="11.5" fill="#52606d">· 대기 ↔ 이동, 추적 → 전투, 전투 ↔ 공격, 복귀 → 대기 : 각 상태의 갱신 함수 내부에서 판정</text>
  <text x="50" y="672" font-size="11.5" fill="#52606d">· 순찰 → 추적, 타깃 상실 → 복귀 : 탐지 코루틴에서 판정 (0.1초 주기)</text>
  <text x="50" y="694" font-size="11.5" fill="#52606d">· 피격 · 기절 · 사망 : 상태머신의 외부 진입점 및 상태값 이벤트에서 강제 전이</text>

  <text x="50" y="722" font-size="11" fill="#7b8794">보스는 동일한 상태 집합을 상속하되 상시 탐지를 비활성화하고 전투 구역 진입 트리거로만 추적에 진입하며, 특수 공격 상태가 추가된다. 특수 공격은 전투에서 공격으로</text>
  <text x="50" y="738" font-size="11" fill="#7b8794">전이하는 시점에 재사용 대기 시간이 경과했다면 일정 확률로 일반 공격을 대신하여 선택되고, 모션 중 피격과 기절이 무효화되며, 진입과 동시에 대기 시간이 초기화된다.</text>
</svg>
