<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 740" width="1020" height="740" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1020" height="740" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4852"/>
    </marker>
  </defs>

  <!-- 기지 -->
  <rect x="390" y="30" width="240" height="60" fill="#e7ecf1" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="510" y="56" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2933">기지 (안전 지대)</text>
  <text x="510" y="76" font-size="11" text-anchor="middle" fill="#52606d">제작 · 정비 · 보관</text>

  <line x1="510" y1="90" x2="510" y2="122" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 출발 게이트 -->
  <rect x="390" y="124" width="240" height="58" fill="#ffffff" stroke="#3d4852" stroke-width="1.5" rx="4"/>
  <text x="510" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">출발 게이트</text>
  <text x="510" y="168" font-size="10.5" text-anchor="middle" fill="#52606d">시작 지점 결정 · 비상구 최원거리 배치</text>

  <line x1="510" y1="182" x2="510" y2="214" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 탐색 구역 -->
  <rect x="320" y="216" width="380" height="96" fill="#f7f8fa" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="510" y="242" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2933">탐색 구역</text>
  <text x="510" y="264" font-size="11.5" text-anchor="middle" fill="#52606d">자원 수집 · 전투 · 스텔스 · 열쇠 탐색</text>
  <text x="510" y="285" font-size="11.5" text-anchor="middle" fill="#52606d">허기 · 갈증 지속 감소 / 소음 · 빛에 따른 탐지</text>
  <text x="510" y="303" font-size="11" text-anchor="middle" fill="#7b8794">런(Run) 단위 진행</text>

  <text x="510" y="337" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2933">런 종료 분기</text>

  <!-- 세 갈래 -->
  <line x1="510" y1="312" x2="510" y2="350" stroke="#3d4852" stroke-width="1.5"/>
  <line x1="150" y1="350" x2="880" y2="350" stroke="#3d4852" stroke-width="1.5"/>
  <line x1="150" y1="350" x2="150" y2="386" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="350" x2="510" y2="386" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="880" y1="350" x2="880" y2="386" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 비상구 귀환 -->
  <rect x="40" y="388" width="220" height="70" fill="#ffffff" stroke="#3d4852" stroke-width="1.5" rx="4"/>
  <text x="150" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">비상구 도달</text>
  <text x="150" y="431" font-size="11" text-anchor="middle" fill="#52606d">비상구 열쇠 소비</text>
  <text x="150" y="448" font-size="11" text-anchor="middle" fill="#7b8794">런 성공</text>

  <!-- 사망 -->
  <rect x="400" y="388" width="220" height="70" fill="#ffffff" stroke="#3d4852" stroke-width="1.5" rx="4"/>
  <text x="510" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">사망</text>
  <text x="510" y="431" font-size="11" text-anchor="middle" fill="#52606d">남은 목숨 1회 차감</text>
  <text x="510" y="448" font-size="11" text-anchor="middle" fill="#7b8794">런 실패</text>

  <!-- 탈출구 -->
  <rect x="770" y="388" width="220" height="70" fill="#ffffff" stroke="#3d4852" stroke-width="1.5" rx="4"/>
  <text x="880" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">탈출구 도달</text>
  <text x="880" y="431" font-size="11" text-anchor="middle" fill="#52606d">탈출구 열쇠 소비</text>
  <text x="880" y="448" font-size="11" text-anchor="middle" fill="#7b8794">세션 성공</text>

  <!-- 사망 → 판정 -->
  <line x1="510" y1="458" x2="510" y2="486" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>
  <polygon points="510,488 600,528 510,568 420,528" fill="#ffffff" stroke="#3d4852" stroke-width="1.5"/>
  <text x="510" y="524" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2933">남은 목숨</text>
  <text x="510" y="542" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2933">&gt; 0 ?</text>

  <line x1="420" y1="528" x2="304" y2="528" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="362" y="519" font-size="11" text-anchor="middle" fill="#1f2933">예</text>

  <line x1="600" y1="528" x2="648" y2="528" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="624" y="519" font-size="11" text-anchor="middle" fill="#1f2933">아니오</text>

  <!-- 사이클 리셋 (성공/실패 공유 경로) -->
  <rect x="62" y="494" width="240" height="70" fill="#dfe6ec" stroke="#1f2933" stroke-width="2" rx="4"/>
  <text x="182" y="518" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">사이클 리셋</text>
  <text x="182" y="537" font-size="11" text-anchor="middle" fill="#52606d">기지 복귀 · 몬스터 리스폰</text>
  <text x="182" y="554" font-size="11" text-anchor="middle" fill="#52606d">컨테이너 · 게이트 복구</text>

  <line x1="150" y1="458" x2="150" y2="492" stroke="#3d4852" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 사이클 리셋 → 기지 순환 -->
  <path d="M 62 529 L 24 529 L 24 60 L 388 60" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <text x="36" y="300" font-size="11.5" font-weight="bold" fill="#1f2933" transform="rotate(-90 36 300)">다음 런으로 순환</text>

  <!-- 게임 오버 -->
  <rect x="650" y="494" width="200" height="70" fill="#ffffff" stroke="#1f2933" stroke-width="2" rx="4"/>
  <text x="750" y="518" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">게임 오버</text>
  <text x="750" y="537" font-size="11" text-anchor="middle" fill="#52606d">세션 종료</text>
  <text x="750" y="554" font-size="10.5" text-anchor="middle" fill="#52606d">구역 진행도 · 보유 자원 초기화</text>

  <!-- 탈출구 → 게임 클리어 -->
  <line x1="880" y1="458" x2="880" y2="606" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <rect x="770" y="608" width="220" height="56" fill="#dfe6ec" stroke="#1f2933" stroke-width="2" rx="4"/>
  <text x="880" y="641" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1f2933">게임 클리어</text>

  <!-- 게임 오버 → 메타 프로그레션 (설계 단계) -->
  <path d="M 750 564 L 750 636 L 504 636" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="62" y="608" width="440" height="56" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.2" stroke-dasharray="5 4" rx="4"/>
  <text x="282" y="631" font-size="12" font-weight="bold" text-anchor="middle" fill="#52606d">메타 프로그레션 — 다음 세션으로 특성 이월</text>
  <text x="282" y="650" font-size="10.5" text-anchor="middle" fill="#7b8794">설계 단계 (본 구현 범위에 포함되지 않음)</text>

  <text x="510" y="706" font-size="11" text-anchor="middle" fill="#7b8794">런 성공(비상구 귀환)과 런 실패(사망)는 동일한 사이클 리셋 경로를 공유하며, 차이는 목숨 자원의 소모 여부에 있다.</text>
</svg>
