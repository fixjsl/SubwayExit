<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 812" width="960" height="812" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="812" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4852"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="14" font-weight="bold" fill="#1f2933">매 프레임 전이 판정 — 조건을 위에서부터 순차 평가하며, 성립하는 첫 조건에서 판정을 종료한다</text>

  <!-- 진입 -->
  <rect x="40" y="56" width="250" height="40" fill="#e7ecf1" stroke="#1f2933" stroke-width="1.8" rx="4"/>
  <text x="165" y="81" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">전이 판정 진입</text>

  <!-- 세로 척추 -->
  <line x1="165" y1="96" x2="165" y2="762" stroke="#3d4852" stroke-width="1.6"/>

  <!-- rows -->
  <g font-size="12">
    <!-- 1 -->
    <rect x="40" y="112" width="250" height="44" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="131" font-weight="bold" fill="#1f2933">1. 이동 잠금 상태인가</text>
    <text x="54" y="148" font-size="11" fill="#7b8794">튜토리얼·연출 구간</text>
    <line x1="290" y1="134" x2="486" y2="134" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="112" width="300" height="44" fill="#f0f2f5" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="140" fill="#1f2933">모든 전이 차단</text>

    <!-- 2 -->
    <rect x="40" y="174" width="250" height="52" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="193" font-weight="bold" fill="#1f2933">2. 캔슬 윈도우 + 회피·패링 버퍼</text>
    <text x="54" y="211" font-size="11" fill="#7b8794">전이 허용 플래그와 무관하게 처리</text>
    <line x1="290" y1="200" x2="486" y2="200" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="174" width="300" height="52" fill="#dfe6ec" stroke="#1f2933" stroke-width="1.6" rx="3"/>
    <text x="502" y="196" font-weight="bold" fill="#1f2933">회피 · 패링으로 즉시 전이</text>
    <text x="502" y="214" font-size="11" fill="#52606d">공격 애니메이션 도중 탈출 경로</text>

    <!-- 3 -->
    <rect x="40" y="244" width="250" height="52" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="263" font-weight="bold" fill="#1f2933">3. 콤보 윈도우 + 공격 버퍼</text>
    <text x="54" y="281" font-size="11" fill="#7b8794">1·2타 종료 후 0.5초 유예 포함</text>
    <line x1="290" y1="270" x2="486" y2="270" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="244" width="300" height="52" fill="#dfe6ec" stroke="#1f2933" stroke-width="1.6" rx="3"/>
    <text x="502" y="266" font-weight="bold" fill="#1f2933">콤보 연계</text>
    <text x="502" y="284" font-size="11" fill="#52606d">상태 재진입 없이 공격 상태 내부에서 처리</text>

    <!-- gate -->
    <rect x="40" y="314" width="250" height="44" fill="#eef1f4" stroke="#1f2933" stroke-width="1.8" rx="3"/>
    <text x="54" y="333" font-weight="bold" fill="#1f2933">4. 현재 상태가 전이를 허용하는가</text>
    <text x="54" y="350" font-size="11" fill="#52606d">canChanged</text>
    <line x1="290" y1="336" x2="486" y2="336" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="314" width="300" height="44" fill="#f0f2f5" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="336" fill="#1f2933">거짓이면 현재 상태 유지</text>
    <text x="502" y="352" font-size="11" fill="#7b8794">공격 · 회피 · 처형 · 피격의 구속 구간</text>

    <!-- 5 -->
    <rect x="40" y="376" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="401" font-weight="bold" fill="#1f2933">5. 웅크리기 토글 ON</text>
    <line x1="290" y1="396" x2="486" y2="396" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="376" width="300" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="401" fill="#1f2933">웅크리기로 전이</text>

    <!-- 6 -->
    <rect x="40" y="434" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="459" font-weight="bold" fill="#1f2933">6. 패링 중 + 방어 입력 유지</text>
    <line x1="290" y1="454" x2="486" y2="454" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="434" width="300" height="40" fill="#dfe6ec" stroke="#1f2933" stroke-width="1.6" rx="3"/>
    <text x="502" y="459" font-weight="bold" fill="#1f2933">가드로 전이 — 패링 실패의 완충</text>

    <!-- 7 -->
    <rect x="40" y="492" width="250" height="52" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="511" font-weight="bold" fill="#1f2933">7. 선입력 버퍼가 남아 있음</text>
    <text x="54" y="529" font-size="11" fill="#7b8794">보관 시간 0.2초</text>
    <line x1="290" y1="518" x2="486" y2="518" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="492" width="300" height="52" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="514" fill="#1f2933">공격 · 처형 · 패링 · 회피 · 상호작용</text>
    <text x="502" y="532" font-size="11" fill="#52606d">공격 입력은 처형 대상 탐색 후 분기</text>

    <!-- 8 -->
    <rect x="40" y="562" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="587" font-weight="bold" fill="#1f2933">8. 가드·패링 중 + 방어 해제</text>
    <line x1="290" y1="582" x2="486" y2="582" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="562" width="300" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="587" fill="#1f2933">대기로 전이</text>

    <!-- 9 -->
    <rect x="40" y="620" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="645" font-weight="bold" fill="#1f2933">9. 웅크리기 중 + 토글 ON</text>
    <line x1="290" y1="640" x2="486" y2="640" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="620" width="300" height="40" fill="#f0f2f5" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="645" fill="#1f2933">판정 종료 — 웅크리기 유지</text>

    <!-- 10 -->
    <rect x="40" y="678" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="703" font-weight="bold" fill="#1f2933">10. 이동 입력이 있음</text>
    <line x1="290" y1="698" x2="486" y2="698" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="678" width="300" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="703" fill="#1f2933">이동으로 전이</text>

    <!-- 11 -->
    <rect x="40" y="736" width="250" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="54" y="761" font-weight="bold" fill="#1f2933">11. 그 외</text>
    <line x1="290" y1="756" x2="486" y2="756" stroke="#3d4852" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="488" y="736" width="300" height="40" fill="#ffffff" stroke="#3d4852" stroke-width="1.4" rx="3"/>
    <text x="502" y="761" fill="#1f2933">대기로 복귀</text>
  </g>

  <!-- 우회 경로 -->
  <rect x="812" y="112" width="130" height="246" fill="#f7f8fa" stroke="#9aa3ad" stroke-width="1.2" stroke-dasharray="5 4" rx="4"/>
  <text x="877" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#52606d">판정 우회</text>
  <text x="877" y="182" font-size="11.5" text-anchor="middle" fill="#1f2933">체력 0 →</text>
  <text x="877" y="200" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2933">사망</text>
  <text x="877" y="224" font-size="10.5" text-anchor="middle" fill="#7b8794">상태값 이벤트로</text>
  <text x="877" y="239" font-size="10.5" text-anchor="middle" fill="#7b8794">강제 전이</text>
  <text x="877" y="272" font-size="11.5" text-anchor="middle" fill="#1f2933">피격 →</text>
  <text x="877" y="290" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2933">피격 / 피해 처리</text>
  <text x="877" y="314" font-size="10.5" text-anchor="middle" fill="#7b8794">피격 차단 플래그가</text>
  <text x="877" y="329" font-size="10.5" text-anchor="middle" fill="#7b8794">참이면 상태 유지</text>
  <text x="877" y="344" font-size="10.5" text-anchor="middle" fill="#7b8794">(가드 · 패링)</text>

  <text x="40" y="800" font-size="11" fill="#7b8794">모든 액티브 상태는 동일한 판정 목록을 공유하며, 상태 간 차이는 전이 허용 플래그를 언제 해제하는가에 있다.</text>
</svg>
