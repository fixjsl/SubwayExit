<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect width="1060" height="700" fill="#ffffff"/>

  <!-- ============ 상단: Wahlberg(2015) ============ -->
  <text x="48" y="44" font-size="19" font-weight="bold" fill="#2c3e50">Wahlberg(2015)의 SID 프레임워크</text>
  <text x="48" y="66" font-size="14" fill="#6b7a88">세 상태가 각각 독립된 단계로 전이한다</text>

  <rect x="40" y="82" width="980" height="196" rx="8" fill="#f6f8fa" stroke="#dde3e9" stroke-width="1"/>

  <!-- SOB -->
  <rect x="88" y="128" width="212" height="96" rx="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="194" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">SOB</text>
  <text x="194" y="180" text-anchor="middle" font-size="12.5" fill="#4a5a68">Solid Obstacle Blockade</text>
  <text x="194" y="205" text-anchor="middle" font-size="14" fill="#2c3e50">상호작용 불가</text>

  <!-- IOB -->
  <rect x="424" y="128" width="212" height="96" rx="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="530" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">IOB</text>
  <text x="530" y="180" text-anchor="middle" font-size="12.5" fill="#4a5a68">Interactive Obstacle Blockade</text>
  <text x="530" y="205" text-anchor="middle" font-size="14" fill="#2c3e50">상호작용 가능</text>

  <!-- DOB -->
  <rect x="760" y="128" width="212" height="96" rx="5" fill="#e8eef5" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="866" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">DOB</text>
  <text x="866" y="180" text-anchor="middle" font-size="12.5" fill="#4a5a68">Disappeared Obstacle Blockade</text>
  <text x="866" y="205" text-anchor="middle" font-size="14" fill="#2c3e50">제거됨 · 통과 가능</text>

  <!-- arrows -->
  <line x1="300" y1="176" x2="416" y2="176" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="358" y="166" text-anchor="middle" font-size="13.5" fill="#2c3e50">열쇠 트리거</text>

  <line x1="636" y1="176" x2="752" y2="176" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="694" y="166" text-anchor="middle" font-size="13.5" fill="#2c3e50">상호작용</text>

  <!-- ============ 하단: 본 게임 ============ -->
  <text x="48" y="340" font-size="19" font-weight="bold" fill="#2c3e50">본 게임(Metro Escape)</text>
  <text x="48" y="362" font-size="14" fill="#6b7a88">아이템 보유 여부에 따라 통행 가능 여부가 결정되는 두 상태로 단순화하였다</text>

  <rect x="40" y="378" width="980" height="212" rx="8" fill="#f6f8fa" stroke="#dde3e9" stroke-width="1"/>

  <!-- SOB -->
  <rect x="88" y="418" width="212" height="96" rx="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="194" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">SOB</text>
  <text x="194" y="470" text-anchor="middle" font-size="12.5" fill="#4a5a68">지정 아이템 미보유</text>
  <text x="194" y="495" text-anchor="middle" font-size="14" fill="#2c3e50">통행 차단</text>

  <!-- DOB -->
  <rect x="760" y="418" width="212" height="96" rx="5" fill="#e8eef5" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="866" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">DOB</text>
  <text x="866" y="470" text-anchor="middle" font-size="12.5" fill="#4a5a68">블록에이드 제거</text>
  <text x="866" y="495" text-anchor="middle" font-size="14" fill="#2c3e50">통행 가능</text>

  <!-- long arrow -->
  <line x1="300" y1="466" x2="752" y2="466" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="526" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">지정 아이템 보유 후 상호작용</text>
  <text x="526" y="487" text-anchor="middle" font-size="12.5" fill="#6b7a88">보스 처치로 획득하는 구역 해방 아이템</text>

  <!-- collapsed IOB -->
  <line x1="526" y1="500" x2="526" y2="522" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="352" y="522" width="348" height="44" rx="5" fill="#fafbfc" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="526" y="550" text-anchor="middle" font-size="14" fill="#7c8894">IOB — 별도의 지속 구간 없이 수렴</text>

  <text x="530" y="634" text-anchor="middle" font-size="13" fill="#6b7a88">아이템 보유 후 상호작용 프롬프트가 표시되는 순간이 IOB에 해당하나, 플레이 단계에서 별도 단계로 인지되지 않는다</text>
</svg>
